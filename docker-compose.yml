services:
  postgres:
    image: postgres:16-alpine
    container_name: mcs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcs
      POSTGRES_PASSWORD: mcs
      POSTGRES_DB: my_collec_skills
    volumes:
      - mcs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcs -d my_collec_skills"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcs_postgres_data:
